name: One public photo through direct Gemini image generation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gemini-public-photo-trial
  cancel-in-progress: false

jobs:
  generate-one:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate one 1K image from the public trial photo
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$GEMINI_API_KEY"
          python3 - <<'PY'
          import base64, json, os, pathlib
          image = pathlib.Path('client-ios/SaintLook/TrialPhotos/photo-1.png').read_bytes()
          request = {
              'model': 'gemini-3-pro-image',
              'input': [
                  {'type': 'text', 'text': 'Create a clean, neutral catalog cutout illustration of the exact white short-sleeve t-shirt shown in the supplied photo. Keep its silhouette, neckline, sleeve length, and color faithful. Show only the garment, centered on a plain light gray background. Do not add text, logos, people, accessories, or other clothing.'},
                  {'type': 'image', 'mime_type': 'image/png', 'data': base64.b64encode(image).decode('ascii')},
              ],
              'response_format': {'type': 'image', 'mime_type': 'image/jpeg', 'image_size': '1K', 'aspect_ratio': '1:1'},
          }
          pathlib.Path(os.environ['RUNNER_TEMP'], 'gemini-request.json').write_text(json.dumps(request))
          key = os.environ['GEMINI_API_KEY']
          curl_config = pathlib.Path(os.environ['RUNNER_TEMP'], 'gemini-curl.conf')
          curl_config.write_text('header = "x-goog-api-key: ' + key.replace('\\', '\\\\').replace('"', '\\"') + '"\n')
          curl_config.chmod(0o600)
          PY
          trap 'rm -f "$RUNNER_TEMP/gemini-curl.conf" "$RUNNER_TEMP/gemini-request.json" "$RUNNER_TEMP/gemini-response.json"' EXIT
          curl --silent --show-error --fail-with-body --max-redirs 0 --retry 0 --max-time 180 \
            -X POST 'https://generativelanguage.googleapis.com/v1beta/interactions' \
            --config "$RUNNER_TEMP/gemini-curl.conf" \
            -H 'content-type: application/json' \
            --data-binary "@$RUNNER_TEMP/gemini-request.json" \
            --output "$RUNNER_TEMP/gemini-response.json"
          python3 - <<'PY'
          import base64, json, os, pathlib, sys
          data = json.loads(pathlib.Path(os.environ['RUNNER_TEMP'], 'gemini-response.json').read_text())
          image = next((content.get('data') for step in data.get('steps', [])
                        for content in step.get('content', [])
                        if step.get('type') == 'model_output' and content.get('type') == 'image'), None)
          if not image:
              print('Gemini returned no output_image; response omitted to protect request data.')
              sys.exit(1)
          out = pathlib.Path('gemini-trial-output')
          out.mkdir()
          raw = base64.b64decode(image, validate=True)
          if not raw.startswith(b'\xff\xd8\xff'):
              raise SystemExit('Gemini output was not a JPEG.')
          (out / 'garment-illustration.jpg').write_bytes(raw)
          usage = data.get('usage', {})
          summary = {
              'model': data.get('model', 'gemini-3-pro-image'),
              'inputPhoto': 'client-ios/SaintLook/TrialPhotos/photo-1.png',
              'output': 'garment-illustration.jpg',
              'outputBytes': len(raw),
              'usage': usage,
              'interactionId': data.get('id'),
          }
          (out / 'summary.json').write_text(json.dumps(summary, indent=2) + '\n')
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gemini-public-photo-trial
          path: gemini-trial-output/
          if-no-files-found: error
          retention-days: 3
