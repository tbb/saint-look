name: Encrypted garment quality diagnostic
on:
  workflow_dispatch:
    inputs:
      item:
        type: choice
        default: hoodie
        options: [hoodie, trousers, tee, checks-only]
permissions:
  contents: read
concurrency:
  group: garment-quality-${{ inputs.item || 'tee' }}
  cancel-in-progress: false
jobs:
  compare:
    if: inputs.item != 'checks-only' && github.ref == 'refs/heads/codex/garment-fit-quality' && (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts
      - name: Load deployed baseline
        run: |
          git show 68e4da3904235196af2d681e3b9a075530b68f41:backend/src/illustration-layout.mjs > backend/src/trial-baseline-layout.mjs
          git show 68e4da3904235196af2d681e3b9a075530b68f41:backend/src/illustration-provider.mjs | sed 's@./illustration-layout.mjs@./trial-baseline-layout.mjs@' > backend/src/trial-baseline-provider.mjs
      - name: Validate one source-preserving generation
        env:
          TRIAL_ITEM: ${{ inputs.item }}
          SAINT_LOOK_ILLUSTRATIONS_ENABLED: 'true'
          SAINT_LOOK_ILLUSTRATION_TIMEOUT_MS: '120000'
          SAINT_LOOK_PHOTOROOM_MODE: production
          PHOTOROOM_PRODUCTION_APPROVED: 'true'
          PHOTOROOM_API_KEY: ${{ secrets.PHOTOROOM_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GARMENT_QUALITY_TRIAL_KEY: ${{ secrets.GARMENT_QUALITY_TRIAL_KEY }}
        run: node scripts/fitting/diagnostics/garment-quality-trial.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-garment-quality
          path: garment-quality-output/
          retention-days: 2
          if-no-files-found: ignore

  image-presentation:
    if: inputs.item == 'checks-only' && github.ref == 'refs/heads/codex/garment-fit-quality' && (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: bash client-ios/scripts/test-image-presentation.sh
      - name: Confirm the same noise fixture fails on the previous crop implementation
        run: |
          set -euo pipefail
          ulimit -c 0
          git fetch --no-tags origin bce0e6c0072902b1ec9dc31b52a1edbb301799ab
          git show FETCH_HEAD:client-ios/SaintLook/GarmentImagePresentation.swift > "$RUNNER_TEMP/Before.swift"
          swiftc "$RUNNER_TEMP/Before.swift" client-ios/scripts/tests/image-presentation.swift -o "$RUNNER_TEMP/before-crop"
          if "$RUNNER_TEMP/before-crop" "$PWD/client-ios/SaintLook/VisualFixtures" > "$RUNNER_TEMP/before-crop.log" 2>&1; then
            echo 'Expected old crop to fail on matte noise'; exit 1
          fi
          rg 'Near-transparent remote matte noise must not shrink' "$RUNNER_TEMP/before-crop.log"
