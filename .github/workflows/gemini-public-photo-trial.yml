name: fal garment comparison diagnostic
on:
  workflow_dispatch:
    inputs:
      batch:
        type: choice
        required: true
        default: initial
        options: [initial, repeat-fashn, repeat-flux, repeat-gpt]
permissions:
  contents: read
concurrency:
  group: fal-garment-comparison
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/codex/fal-garment-comparison' && github.run_attempt == 1 && (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm --prefix backend ci --ignore-scripts
      - name: Generate once per case and evaluate layer compatibility
        env:
          FAL_COMPARISON_BATCH: ${{ inputs.batch }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PHOTOROOM_API_KEY: ${{ secrets.PHOTOROOM_API_KEY }}
          GARMENT_QUALITY_TRIAL_KEY: ${{ secrets.GARMENT_QUALITY_TRIAL_KEY }}
        run: node scripts/fitting/fal-comparison/run.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encrypted-fal-comparison
          path: fal-comparison-output/
          retention-days: 3
          if-no-files-found: ignore
