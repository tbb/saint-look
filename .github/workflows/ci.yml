name: macOS sample diagnostic probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sample-probe:
    if: github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true'
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - name: Installed tool usage and owned-process probe
        run: |
          python3 - <<'PYTHON'
          import subprocess,time, pathlib
          for command in [['/usr/bin/sample','-h'],['/usr/bin/man','sample']]:
              result=subprocess.run(command,capture_output=True,text=True,timeout=15)
              print('COMMAND',command,'EXIT',result.returncode,flush=True)
              print(result.stdout,result.stderr,flush=True)
          child=subprocess.Popen(['/bin/sleep','90'])
          target=pathlib.Path('/tmp/saint-look-sample-probe.txt')
          try:
              started=time.monotonic()
              result=subprocess.run(['/usr/bin/sample',str(child.pid),'1','10','-file',str(target)],capture_output=True,text=True,timeout=45)
              print('SAMPLE_ELAPSED',time.monotonic()-started,'EXIT',result.returncode,flush=True)
              print(result.stdout,result.stderr,flush=True)
              print('REPORT_EXISTS',target.exists(),flush=True)
              if target.exists(): print(target.read_text()[:16000],flush=True)
          except subprocess.TimeoutExpired as error:
              print('SAMPLE_HARD_LIMIT_45S',str(error),flush=True)
              print('PARTIAL_STDOUT',error.stdout,'PARTIAL_STDERR',error.stderr,flush=True)
          finally:
              child.terminate()
              child.wait(timeout=3)
          PYTHON
