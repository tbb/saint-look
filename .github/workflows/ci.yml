name: Local ingestion checks

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'client-ios/**'
      - 'docs/api/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ingestion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # This condition is intentionally present on EVERY job, before runner allocation.
    # Standard hosted runners are free for public repositories.
    # Private repositories still require verified quota and a $0 paid-overage hard stop.
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines() if base and head else []
          common = not base or any(p.startswith(('docs/api/', '.github/workflows/')) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, prefix in [('backend', 'backend/'), ('ios', 'client-ios/')]:
                  needed = common or any(p.startswith(prefix) for p in paths)
                  output.write(f'{name}={str(needed).lower()}\n')
          PY

  backend:
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true') && needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm --prefix backend run check
      - run: npm --prefix backend test

  ios:
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true') && needs.changes.outputs.ios == 'true'
    needs: changes
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts
      - name: Real Simulator and local backend (controlled providers)
        env:
          NODE_ENV: test
          SAINT_LOOK_TEST_CLOCK_FILE: ${{ runner.temp }}/saint-look-clock.json
          SAINT_LOOK_RECORD_VIDEO: '1'
          SAINT_LOOK_OWNER_TOKEN: saint-look-ui-tests-owner-token-00000001
          SAINT_LOOK_PROVIDER: live
          SAINT_LOOK_TEST_PROVIDER_ORIGIN: http://127.0.0.1:8789
          GEMINI_API_KEY: fixture-gemini-key
          PHOTOROOM_API_KEY: fixture-photoroom-key
          SAINT_LOOK_PROVIDER_PREFLIGHT_CONFIRMED: 'true'
          SAINT_LOOK_STAGE_DELAY_MS: '100'
          SAINT_LOOK_PROVIDER_TIMEOUT_MS: '5000'
          SAINT_LOOK_UI_PROVIDER_CONTROL_URL: http://127.0.0.1:8789/__control
          SAINT_LOOK_UI_PROVIDER_CONTROL_TOKEN: saint-look-ui-provider-control-token-00000001
          SAINT_LOOK_DATA_DIR: ${{ runner.temp }}/saint-look-backend
          SAINT_LOOK_UI_TEST_URL: http://127.0.0.1:8788
          SAINT_LOOK_UI_TEST_TOKEN: saint-look-ui-tests-owner-token-00000001
          SAINT_LOOK_UI_TEST_CONTROL_URL: http://127.0.0.1:8788/__control
          SAINT_LOOK_UI_TEST_CONTROL_TOKEN: saint-look-ui-control-test-token-00000001
        run: |
          wait_for_health() {
            local url="$1"
            for attempt in {1..50}; do
              if curl --max-time 1 --fail --silent "$url" > /dev/null; then return 0; fi
              sleep 0.2
            done
            echo "Health check timed out: $url" >&2
            return 1
          }
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            if [[ -n "$backend_pid" ]]; then kill "$backend_pid" 2>/dev/null || true; fi
            if [[ -n "$provider_pid" ]]; then kill "$provider_pid" 2>/dev/null || true; fi
          }
          provider_pid=''
          node -e 'require("node:fs").writeFileSync(process.env.SAINT_LOOK_TEST_CLOCK_FILE, JSON.stringify({offsetMs: 0}))'
          backend_pid=''
          proxy_pid=''
          trap cleanup EXIT
          node backend/test/providers/ui-server.mjs > "$RUNNER_TEMP/ui-provider.log" 2>&1 &
          provider_pid=$!
          wait_for_health http://127.0.0.1:8789/health
          node backend/src/server.mjs > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          wait_for_health http://127.0.0.1:8787/health
          node client-ios/scripts/ui-test-proxy.mjs > "$RUNNER_TEMP/ui-proxy.log" 2>&1 &
          proxy_pid=$!
          wait_for_health http://127.0.0.1:8788/health
          bash client-ios/scripts/test-simulator.sh
      - name: Upload Simulator screencast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-ui-video
          path: client-ios/build/videos/*.mp4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0
