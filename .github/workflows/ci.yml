name: Local ingestion checks

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'shared/**'
      - 'backend/**'
      - 'client-ios/**'
      - 'docs/api/**'
      - '.github/workflows/**'
      - 'scripts/deploy/**'
      - 'docs/deployment.md'
      - 'fly.toml'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      ios_suite:
        description: Local Simulator suite
        type: choice
        default: all
        options: [all, wardrobe, outfits]

permissions:
  contents: read

concurrency:
  group: ingestion-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    # This condition is intentionally present on EVERY job, before runner allocation.
    # Standard hosted runners are free for public repositories.
    # Private repositories still require verified quota and a $0 paid-overage hard stop.
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os, subprocess
          base, head = os.environ['BASE_SHA'], os.environ['HEAD_SHA']
          paths = subprocess.check_output(['git', 'diff', '--name-only', base, head], text=True).splitlines() if base and head else []
          common = not base or any(p.startswith(('shared/', 'docs/api/', '.github/workflows/')) for p in paths)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name, prefix in [('backend', 'backend/'), ('ios', 'client-ios/')]:
                  needed = common or any(p.startswith(prefix) for p in paths)
                  output.write(f'{name}={str(needed).lower()}\n')
          PY

  backend:
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true') && needs.changes.outputs.backend == 'true'
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts
      - run: npm --prefix backend run check
      - run: npm --prefix backend test

  ios:
    name: ${{ matrix.suite == 'wardrobe' && 'ios' || 'ios-outfits' }}
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true') && needs.changes.outputs.ios == 'true'
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(inputs.ios_suite == 'outfits' && '["outfits"]' || inputs.ios_suite == 'wardrobe' && '["wardrobe"]' || '["wardrobe","outfits"]') }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.suite == 'outfits' && 45 || 30 }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm --prefix backend ci --ignore-scripts
      - run: bash client-ios/scripts/test-outfit-core.sh
      - name: Real Simulator and local backend (controlled providers)
        env:
          TEST_SUITE: ${{ matrix.suite }}
          SAINT_LOOK_UI_TEST_ONLY: SaintLookUITests/OutfitFlowTests/testMissingBodyLayerOpensItsPickerDirectlyAndCancelPreservesTheLook
          NODE_ENV: test
          SAINT_LOOK_TEST_CLOCK_FILE: ${{ runner.temp }}/saint-look-clock.json
          SAINT_LOOK_RECORD_VIDEO: '1'
          SAINT_LOOK_OWNER_TOKEN: saint-look-ui-tests-owner-token-00000001
          SAINT_LOOK_PROVIDER: live
          SAINT_LOOK_TEST_PROVIDER_ORIGIN: http://127.0.0.1:8789
          TYPESAFE_API_KEY: fixture-typesafe-key
          PHOTOROOM_API_KEY: fixture-photoroom-key
          SAINT_LOOK_PROVIDER_PREFLIGHT_CONFIRMED: 'true'
          SAINT_LOOK_STAGE_DELAY_MS: '100'
          SAINT_LOOK_PROVIDER_TIMEOUT_MS: '5000'
          SAINT_LOOK_UI_PROVIDER_CONTROL_URL: http://127.0.0.1:8789/__control
          SAINT_LOOK_UI_PROVIDER_CONTROL_TOKEN: saint-look-ui-provider-control-token-00000001
          SAINT_LOOK_DATA_DIR: ${{ runner.temp }}/saint-look-backend
          SAINT_LOOK_UI_TEST_URL: http://127.0.0.1:8788
          SAINT_LOOK_UI_TEST_TOKEN: saint-look-ui-tests-owner-token-00000001
          SAINT_LOOK_UI_TEST_CONTROL_URL: http://127.0.0.1:8788/__control
          SAINT_LOOK_UI_TEST_CONTROL_TOKEN: saint-look-ui-control-test-token-00000001
        run: |
          wait_for_health() {
            local url="$1"
            for attempt in {1..50}; do
              if curl --max-time 1 --fail --silent "$url" > /dev/null; then return 0; fi
              sleep 0.2
            done
            echo "Health check timed out: $url" >&2
            return 1
          }
          cleanup() {
            if [[ -n "$proxy_pid" ]]; then kill "$proxy_pid" 2>/dev/null || true; fi
            if [[ -n "$backend_pid" ]]; then kill "$backend_pid" 2>/dev/null || true; fi
            if [[ -n "$provider_pid" ]]; then kill "$provider_pid" 2>/dev/null || true; fi
          }
          provider_pid=''
          node -e 'require("node:fs").writeFileSync(process.env.SAINT_LOOK_TEST_CLOCK_FILE, JSON.stringify({offsetMs: 0}))'
          backend_pid=''
          proxy_pid=''
          trap cleanup EXIT
          node backend/test/providers/ui-server.mjs > "$RUNNER_TEMP/ui-provider.log" 2>&1 &
          provider_pid=$!
          wait_for_health http://127.0.0.1:8789/health
          node backend/src/server.mjs > "$RUNNER_TEMP/backend.log" 2>&1 &
          backend_pid=$!
          wait_for_health http://127.0.0.1:8787/health
          node client-ios/scripts/ui-test-proxy.mjs > "$RUNNER_TEMP/ui-proxy.log" 2>&1 &
          proxy_pid=$!
          wait_for_health http://127.0.0.1:8788/health
          if [[ "$TEST_SUITE" == "outfits" ]]; then
            # Run both independent font-size checks, preserving failure and cancellation.
            trap 'exit 130' INT
            trap 'exit 143' TERM
            normal_status=0
            bash client-ios/scripts/test-simulator.sh || normal_status=$?
            if (( normal_status >= 128 )); then exit "$normal_status"; fi
            large_status=0
            SAINT_LOOK_UI_CONTENT_SIZE=accessibility-extra-extra-extra-large \
            SAINT_LOOK_UI_TEST_ONLY=SaintLookUITests/OutfitFlowTests/testOutfitActionsStayLocalAndAccessibleWithoutSwipes \
            bash client-ios/scripts/test-simulator.sh || large_status=$?
            if (( large_status >= 128 )); then exit "$large_status"; fi
            if (( normal_status != 0 )); then exit "$normal_status"; fi
            exit "$large_status"
          fi
          bash client-ios/scripts/test-simulator.sh
          if [[ "$TEST_SUITE" == "wardrobe" ]]; then
          # Exercise the explicit XCTest manifest using one existing local test.
          # This validates the runner path; it is not a remote deployment demonstration.
          SAINT_LOOK_REMOTE_SMOKE=1 \
          SAINT_LOOK_REMOTE_URL=https://example.invalid \
          SAINT_LOOK_REMOTE_TOKEN="$SAINT_LOOK_UI_TEST_TOKEN" \
          SAINT_LOOK_REMOTE_REVISION="$(git rev-parse HEAD)" \
          SAINT_LOOK_REMOTE_DEPLOYMENT_ID=local-harness-validation \
          SAINT_LOOK_UI_TEST_ONLY=SaintLookUITests/WardrobeFlowTests/testPhotoBecomesReadyThroughBackendAndSurvivesOfflineRelaunch \
          SAINT_LOOK_RECORD_VIDEO=0 \
          bash client-ios/scripts/test-simulator.sh
          fi
      - name: Upload Simulator screencast
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-ui-video-${{ matrix.suite }}
          path: client-ios/build/videos/*.mp4
          if-no-files-found: warn
          retention-days: 7
          compression-level: 0

      - name: Export Simulator screenshots
        if: always()
        run: |
          mkdir -p client-ios/build/screenshots
          for result in client-ios/build/*.xcresult; do
            [[ -d "$result" ]] || continue
            output="client-ios/build/screenshots/$(basename "$result" .xcresult)"
            xcrun xcresulttool export attachments --path "$result" --output-path "$output"
          done
      - name: Upload Simulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshots-${{ matrix.suite }}
          path: client-ios/build/screenshots
          if-no-files-found: warn
          retention-days: 7
      - name: Upload local XCTest results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-results-${{ matrix.suite }}
          path: client-ios/build/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  deploy-policy:
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/deploy/*.test.mjs

  container:
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build the checked source and verify persistent storage
        run: |
          revision="$(git rev-parse HEAD)"
          printf '%s\n' "$revision" > backend/REVISION
          docker build -f backend/Dockerfile -t saint-look-ci .
          node backend/test/container-smoke.mjs saint-look-ci "$revision"
