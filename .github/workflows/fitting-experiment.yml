name: Fitting experiment local checks

on:
  pull_request:
    paths:
      - 'scripts/fitting/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/jev.mjs'
      - 'shared/wardrobe-taxonomy.json'
      - 'scripts/deploy/synthetic.png'
      - 'docs/research/fitting-*.md'
      - '.github/workflows/fitting-experiment.yml'
      - '.github/workflows/fitting-live-trial.yml'
      - '.github/workflows/fitting-jev-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/fitting/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/src/jev.mjs'
      - 'shared/wardrobe-taxonomy.json'
      - 'scripts/deploy/synthetic.png'
      - '.github/workflows/fitting-experiment.yml'
      - '.github/workflows/fitting-live-trial.yml'
      - '.github/workflows/fitting-jev-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fitting-local:
    if: (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install image decoder from the existing backend lockfile
        run: npm --prefix backend ci --ignore-scripts
      - name: Test only loopback fixtures; no provider secrets or paid API calls
        run: node --test scripts/fitting/*.test.mjs
