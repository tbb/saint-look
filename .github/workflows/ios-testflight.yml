name: Internal TestFlight

on:
  pull_request:
    paths:
      - 'client-ios/**'
      - 'shared/**'
      - '.github/workflows/ios-testflight.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: 'check: no Apple access; prepare-signing: one-time certificate; upload: internal TestFlight'
        required: true
        type: choice
        default: check
        options: [check, prepare-signing, upload]

permissions:
  contents: read
  actions: read

concurrency:
  group: testflight-${{ github.event.pull_request.number || github.ref }}
  # Never interrupt a certificate creation or an uncertain Apple upload.
  cancel-in-progress: false

jobs:
  policy:
    if: github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python3 client-ios/scripts/tests/test-testflight.py
      - run: node --test client-ios/scripts/tests/testflight-signing.test.mjs

  archive-check:
    if: github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true'
    needs: policy
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # Disposable connection defaults; no Apple or owner secret is available.
      - run: python3 client-ios/scripts/testflight.py check

  prepare-signing:
    if: >-
      (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true') &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.operation == 'prepare-signing'
    needs: [policy, archive-check]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Install encryption tool
        run: sudo apt-get update -qq && sudo apt-get install -y age
      - name: Prepare signing assets without a local Mac
        env:
          IOS_TESTFLIGHT_ENABLED: ${{ vars.IOS_TESTFLIGHT_ENABLED }}
          IOS_TESTFLIGHT_BUNDLE_ID: ${{ vars.IOS_TESTFLIGHT_BUNDLE_ID }}
          IOS_IPA_AGE_RECIPIENT: ${{ vars.IOS_IPA_AGE_RECIPIENT }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: node client-ios/scripts/testflight-signing.mjs "$RUNNER_TEMP/signing-output/signing-assets.tar.age"
      - name: Retain encrypted recovery material, including partial setup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestFlight-signing-${{ github.run_id }}
          path: ${{ runner.temp }}/signing-output/*.age
          if-no-files-found: ignore
          retention-days: 3
          compression-level: 0
      - name: Clean encrypted output
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing-output"

  upload:
    if: >-
      (github.event.repository.visibility == 'public' || vars.ACTIONS_BUDGET_VERIFIED == 'true') &&
      github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.operation == 'upload'
    needs: [policy, archive-check]
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require successful CI for this exact main revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 client-ios/scripts/testflight-ci.py
      - name: Archive, sign and upload for internal TestFlight only
        env:
          IOS_TESTFLIGHT_ENABLED: ${{ vars.IOS_TESTFLIGHT_ENABLED }}
          IOS_TESTFLIGHT_BUNDLE_ID: ${{ vars.IOS_TESTFLIGHT_BUNDLE_ID }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          ASC_KEY_ID: ${{ vars.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ vars.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_DISTRIBUTION_P12_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_P12_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
          SAINT_LOOK_DEV_URL: ${{ vars.SAINT_LOOK_DEV_URL }}
          SAINT_LOOK_DEV_OWNER_TOKEN: ${{ secrets.SAINT_LOOK_DEV_OWNER_TOKEN }}
        run: python3 client-ios/scripts/testflight.py upload
